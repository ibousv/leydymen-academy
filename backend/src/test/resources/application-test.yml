spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.leydymen: DEBUG

app:
  jwtSecret: test-secret-key-min-256-chars-long-for-testing-purposes-only-change-in-production-environment-now-test
  jwtExpirationMs: 86400000
  jwtRefreshExpirationMs: 604800000
