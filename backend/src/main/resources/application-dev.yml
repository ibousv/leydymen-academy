spring:
  datasource:
    url: jdbc:mysql://localhost:3306/leydymen_db_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    root: DEBUG
    com.leydymen: DEBUG
    org.springframework: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

app:
  jwtSecret: dev-secret-key-min-256-chars-long-for-development-purposes-only-change-in-production-environment-now
