spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/leydymen_db?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true

server:
  port: ${SERVER_PORT:8080}
  ssl:
    enabled: ${SSL_ENABLED:false}
    key-store: ${SSL_KEYSTORE_PATH}
    key-store-password: ${SSL_KEYSTORE_PASSWORD}
    key-store-type: PKCS12
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    com.leydymen: INFO
    org.springframework: WARN
  file:
    name: /var/logs/leydymen-backend/application.log
    max-size: 50MB
    max-history: 30

app:
  jwtSecret: ${JWT_SECRET:change-me-in-production-environment-with-strong-secret-key-min-256-chars}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}
  jwtRefreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized
