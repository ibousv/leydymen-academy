<div class="auth-page">
  <form class="auth-card" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" novalidate>
    <span class="auth-card__brand">{{ APP_NAME }}</span>
    <h1 class="auth-card__title">Mot de passe oublié?</h1>
    <p class="auth-card__subtitle">
      Saisissez votre email pour recevoir un lien de réinitialisation.
    </p>

    @if (successMessage(); as message) {
      <p class="auth-card__success" role="status">{{ message }}</p>
    } @else {
      <app-input
        label="Email"
        type="email"
        placeholder="ex. awa@example.com"
        formControlName="email"
        [error]="emailError()"
      />

      @if (errorMessage(); as message) {
        <p class="auth-card__error" role="alert">{{ message }}</p>
      }

      <app-button [label]="loading() ? 'Envoi…' : 'Envoyer le lien'" [loading]="loading()" (click)="onSubmit()" />
    }

    <p class="auth-card__footer">
      <a class="auth-card__link" [routerLink]="ROUTES.login">Retour à la connexion</a>
    </p>
  </form>
</div>
