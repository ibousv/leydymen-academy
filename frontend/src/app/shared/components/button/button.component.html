<button
  type="button"
  [class]="classes()"
  [class.btn-loading]="loading()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() || null"
  (click)="onClick($event)"
>
  @if (icon(); as icon) {
    <span aria-hidden="true">{{ icon }}</span>
  }
  <span>{{ label() }}</span>
</button>
