<div class="form-field">
  <label class="form-field__label" [for]="selectId">{{ label() }}</label>
  <select [id]="selectId" class="select" [disabled]="disabled()" (change)="onChange($event)">
    @for (option of options(); track option.label; let i = $index) {
      <option [value]="i" [selected]="option.value === selected()">{{ option.label }}</option>
    }
  </select>
</div>
