user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript 
             application/json application/javascript application/xml+rss 
             application/rss+xml font/truetype font/opentype 
             application/vnd.ms-fontobject image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    # Angular routing - redirect all requests to index.html for SPA
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Cache static assets (js, css, etc.)
    location ~* \.(?:js|css|map|woff2?|ttf|otf|eot|svg)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # Cache images
    location ~* \.(?:jpg|jpeg|gif|png|webp|ico|svg)$ {
      expires 7d;
      add_header Cache-Control "public";
      access_log off;
    }

    # Don't cache HTML
    location ~* \.html?$ {
      expires 0;
      add_header Cache-Control "public, must-revalidate";
      add_header ETag $request_filename;
    }

    # Deny access to dot files
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }
  }
}
