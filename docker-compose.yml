
services:
  # ====================
  # MYSQL DATABASE 
  # ====================
  mysql:
    image: mysql:8.0
    container_name: leydymen-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-leydymen_db}
      MYSQL_USER: ${MYSQL_USER:-leydymen_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-leydymen_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - leydymen-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-leydymen_user}", "-p${MYSQL_PASSWORD:-leydymen_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===================================
  # SPRING BOOT BACKEND - API REST
  # ==================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: leydymen-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-leydymen_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-leydymen_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-leydymen_pass}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-your-secret-key-min-256-characters-long-for-hs256-algorithm-security}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_JWT_REFRESH_EXPIRATION_MS: ${APP_JWT_REFRESH_EXPIRATION_MS:-604800000}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_LEYDYMEN: ${LOGGING_LEVEL_COM_LEYDYMEN:-DEBUG}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - leydymen-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ====================
  # ANGULAR FRONTEND 
  # ===================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: leydymen-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - leydymen-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    environment:
      - NODE_ENV=production

  # =========================================
  # PHPMYADMIN - Interface de gestion MySQL 
  # =========================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: leydymen-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: ${MYSQL_USER:-leydymen_user}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-leydymen_pass}
      PMA_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - mysql
    networks:
      - leydymen-network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local

networks:
  leydymen-network:
    driver: bridge
